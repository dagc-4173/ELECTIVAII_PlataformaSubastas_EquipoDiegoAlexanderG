<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Plataforma de Subastas</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./session.js"></script>
  </head>
  <body>
    <header class="brand">Plataforma de Subastas</header>
    <main>
      <section class="card" aria-labelledby="login-heading" id="login" hidden>
        <h1 id="login-heading" tabindex="-1">Iniciar sesión</h1>
        <form id="login-form">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="submit" type="submit">Ingresar</button>
        </form>
        <button class="text-button" id="open-registration" type="button">Crear una cuenta</button>
        <button class="text-button" id="open-recovery" type="button">Olvidé mi contraseña</button>
      </section>
      <section class="card" id="recovery" aria-labelledby="recovery-heading" hidden>
        <h1 id="recovery-heading" tabindex="-1">Recuperar contraseña</h1>
        <form id="recovery-form">
          <label for="recovery-email">Correo electrónico</label>
          <input id="recovery-email" name="email" type="email" autocomplete="username" required>
          <button type="submit">Solicitar enlace</button>
        </form>
        <button class="text-button" id="back-from-recovery" type="button">Volver a iniciar sesión</button>
      </section>
      <section class="card" id="reset" aria-labelledby="reset-heading" hidden>
        <h1 id="reset-heading" tabindex="-1">Nueva contraseña</h1>
        <form id="reset-form">
          <label for="new-password">Contraseña nueva</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <label for="confirm-password">Confirma la contraseña</label>
          <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button type="submit">Guardar contraseña</button>
        </form>
        <button class="text-button" id="back-from-reset" type="button">Volver a iniciar sesión</button>
      </section>
      <section class="card" aria-labelledby="registration-heading" id="registration" hidden>
        <h1 id="registration-heading" tabindex="-1">Crear cuenta</h1>
        <form id="registration-form">
          <label for="register-name">Nombre</label>
          <input id="register-name" name="name" autocomplete="name" required>
          <label for="register-email">Correo electrónico</label>
          <input id="register-email" name="email" type="email" autocomplete="username" required>
          <label for="register-password">Contraseña</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" required>
          <button id="register-submit" type="submit">Crear cuenta</button>
        </form>
        <button class="text-button" id="back-to-login" type="button">Volver a iniciar sesión</button>
      </section>
      <section class="card" aria-labelledby="profile-heading" id="profile" hidden>
        <h1 id="profile-heading" tabindex="-1">Mi perfil</h1>
        <p id="profile-name"></p>
        <p id="profile-email"></p>
        <button id="open-auctions" type="button">Ver subastas</button>
        <button id="logout" type="button">Cerrar sesión</button>
      </section>
      <section id="auctions" hidden>
        <button class="text-button" id="back-to-profile" type="button">Mi perfil</button>
        <section id="auction-list" aria-labelledby="auctions-heading">
          <h1 id="auctions-heading" tabindex="-1">Subastas</h1>
          <button id="open-publication" type="button">Publicar subasta</button>
          <form id="auction-filters" class="auction-filters">
            <label for="filter-category">Categoría
              <input id="filter-category" name="categoryId">
            </label>
            <label for="filter-state">Estado
              <select id="filter-state" name="status">
                <option value="">Todos</option>
                <option value="OPEN">Abiertas</option>
                <option value="CLOSED">Cerradas</option>
                <option value="CANCELLED">Canceladas</option>
                <option value="DESERTED">Desiertas</option>
                <option value="DEFAULTED">Incumplidas</option>
              </select>
            </label>
            <button type="submit">Buscar</button>
          </form>
          <ul id="auction-cards" class="auction-cards"></ul>
          <nav id="auction-pagination" class="auction-pagination" aria-label="Páginas de subastas" hidden>
            <button type="button" id="previous-page">Anterior</button>
            <span id="auction-page"></span>
            <button type="button" id="next-page">Siguiente</button>
          </nav>
        </section>
        <section class="card" id="auction-publication" aria-labelledby="publication-heading" hidden>
          <button class="text-button" id="cancel-publication" type="button">Volver a subastas</button>
          <h1 id="publication-heading" tabindex="-1">Publicar subasta</h1>
          <form id="publication-form">
            <label for="item">Artículo</label>
            <input id="item" name="itemId" required>
            <label for="category">Categoría</label>
            <input id="category" name="categoryId" required>
            <label for="auction-photo">Foto del artículo (opcional)</label>
            <input id="auction-photo" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-formats">
            <small id="photo-formats">JPEG, PNG o WebP, hasta 2 MB.</small>
            <img id="photo-preview" class="auction-photo" alt="Vista previa de la foto" hidden>
            <fieldset id="publication-terms">
              <label for="base-price">Precio base (COP)</label>
              <input id="base-price" name="basePrice" type="number" min="1" step="1" required>
              <label for="minimum-increment">Incremento mínimo (COP)</label>
              <input id="minimum-increment" name="minimumIncrement" type="number" min="1" step="1" required>
              <label for="closing-date">Fecha y hora de cierre</label>
              <input id="closing-date" name="closesAt" type="datetime-local" aria-describedby="publication-duration" required>
              <small id="publication-duration">La subasta debe durar entre 1 hora y 30 días.</small>
            </fieldset>
            <button type="submit">Publicar</button>
          </form>
        </section>
        <section class="card" id="auction-detail" aria-labelledby="auction-detail-heading" hidden>
          <button class="text-button" id="back-to-auctions" type="button">Volver a subastas</button>
          <h1 id="auction-detail-heading" tabindex="-1">Detalle de subasta</h1>
          <p id="auction-connection" role="status" hidden></p>
          <p id="auction-live-notice" role="status" hidden></p>
          <div id="auction-detail-content"></div>
          <button id="edit-publication" type="button" hidden>Editar publicación</button>
          <form id="bid-form" novalidate hidden>
            <label for="bid-amount">Tu oferta (COP)</label>
            <input id="bid-amount" name="amount" type="number" min="1" step="1" aria-describedby="bid-minimum bid-feedback" required>
            <small id="bid-minimum"></small>
            <button type="submit">Ofertar</button>
          </form>
          <p id="bid-feedback" role="alert"></p>
        </section>
        <p id="auction-status" role="status"></p>
      </section>
      <p id="status" role="status">Comprobando sesión…</p>
      <button id="retry" type="button" hidden>Reintentar</button>
      <noscript>Activa JavaScript para iniciar sesión.</noscript>
    </main>
  </body>
</html>
